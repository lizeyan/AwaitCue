name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed and notarized release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BrowserExtension/package-lock.json
      - name: Verify tag belongs to master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master
      - name: Run all required checks
        run: ./Scripts/check.sh
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          test -n "${CERTIFICATE_BASE64}"
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/awaitcue.keychain-db"
          echo "${CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychain -d user -s "${keychain_path}"
      - name: Decode notarization key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          test -n "${NOTARY_KEY_BASE64}"
          echo "${NOTARY_KEY_BASE64}" | base64 --decode > "${RUNNER_TEMP}/AuthKey.p8"
      - name: Build and sign DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: |
          export VERSION="${VERSION#v}"
          ./Scripts/package-release.sh
      - name: Notarize and staple DMG
        env:
          VERSION: ${{ github.ref_name }}
          APPLE_NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          export VERSION="${VERSION#v}"
          ./Scripts/notarize-release.sh
      - name: Build Chromium extension archive
        run: |
          npm --prefix BrowserExtension run build
          ditto -c -k --sequesterRsrc --keepParent BrowserExtension/dist "dist/AwaitCue-Chromium-${GITHUB_REF_NAME#v}.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          plain_version="${VERSION#v}"
          gh release create "${VERSION}" \
            "dist/AwaitCue-${plain_version}.dmg" \
            "dist/AwaitCue-Chromium-${plain_version}.zip" \
            --generate-notes \
            --verify-tag
