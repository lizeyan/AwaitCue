name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build, tests, and coverage
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors
      - name: Run macOS AppKit end-to-end behavior tests
        run: ./Scripts/run-macos-e2e.sh
      - name: Run Swift coverage gate
        run: ./Scripts/swift-coverage.sh
      - name: Build application bundle
        run: ./Scripts/build-app.sh
      - name: Upload Swift coverage
        uses: actions/upload-artifact@v7
        with:
          name: swift-coverage
          path: coverage/swift.lcov
          if-no-files-found: error

  extension:
    name: Chromium extension tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BrowserExtension/package-lock.json
      - name: Install dependencies
        run: npm --prefix BrowserExtension ci
      - name: Lint
        run: npm --prefix BrowserExtension run lint
      - name: Typecheck
        run: npm --prefix BrowserExtension run typecheck
      - name: Test with coverage gate
        run: npm --prefix BrowserExtension run coverage
      - name: Build extension
        run: npm --prefix BrowserExtension run build
      - name: Upload extension coverage
        uses: actions/upload-artifact@v7
        with:
          name: extension-coverage
          path: BrowserExtension/coverage
          if-no-files-found: error
      - name: Upload unpacked extension
        uses: actions/upload-artifact@v7
        with:
          name: chromium-extension
          path: BrowserExtension/dist
          if-no-files-found: error

  benchmark:
    name: Decision benchmark fixtures and scoring
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test benchmark scoring and contracts
        run: node --test Benchmarks/Decision/tests/*.test.mjs
      - name: Validate fixed benchmark corpus
        run: node Scripts/run-decision-benchmark.mjs --dry-run

  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check tracked files and credentials
        run: ./Scripts/policy-check.sh

  gate:
    name: CI gate
    if: always()
    needs: [swift, extension, benchmark, policy]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job
        env:
          SWIFT_RESULT: ${{ needs.swift.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          test "${SWIFT_RESULT}" = success
          test "${EXTENSION_RESULT}" = success
          test "${BENCHMARK_RESULT}" = success
          test "${POLICY_RESULT}" = success
